# OrzuAI LiveKit Internet Phone voice agent (Railway service).
# Deploy from repo root so npm workspaces resolve.
# Set Railway Config File path to: apps/livekit-voice-agent/railway.toml

[build]
builder = "RAILPACK"
watchPatterns = [
  "apps/livekit-voice-agent/**",
  "package.json",
  "package-lock.json",
  "apps/livekit-voice-agent/railway.toml",
  "apps/livekit-voice-agent/railpack.json"
]

[deploy]
startCommand = "npm run start --workspace=@orzu/livekit-voice-agent"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

