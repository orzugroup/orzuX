# OrzuAI WhatsApp Web worker service (Baileys integration with persistent socket)
# Deploy from repo root so npm workspaces resolve dependencies.

[build]
builder = "RAILPACK"
watchPatterns = ["apps/whatsapp-web/**", "package.json", "package-lock.json", "railway.toml", "railway.whatsapp.toml", "railpack.json"]

[deploy]
startCommand = "node --import tsx apps/whatsapp-web/src/index.ts"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

